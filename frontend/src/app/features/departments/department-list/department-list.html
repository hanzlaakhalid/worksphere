<div class="page">
  <header class="page-header">
    <h1>Departments</h1>
    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add_business</mat-icon>
      New Department
    </button>
  </header>

  @if (error()) {
    <div class="list-error" role="alert">{{ error() }}</div>
  }

  <app-data-table
    [loading]="loading()"
    [empty]="!loading() && departments().length === 0"
    emptyIcon="apartment"
    emptyTitle="No departments yet"
    emptyDescription="Create your first department to start organizing employees."
  >
    <table mat-table [dataSource]="departments()" class="department-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let dept">{{ dept.name }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let dept">{{ dept.description || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="manager">
        <th mat-header-cell *matHeaderCellDef>Manager</th>
        <td mat-cell *matCellDef="let dept">
          {{ dept.manager ? dept.manager.firstName + ' ' + dept.manager.lastName : '—' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="employeeCount">
        <th mat-header-cell *matHeaderCellDef>Employees</th>
        <td mat-cell *matCellDef="let dept">{{ dept.employeeCount }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let dept">
          <button mat-icon-button (click)="openEditDialog(dept, $event)" aria-label="Edit department">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="deleteDepartment(dept, $event)" aria-label="Delete department">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </app-data-table>
</div>
