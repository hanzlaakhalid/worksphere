<div class="page">
  <header class="page-header">
    <h1>Jobs</h1>
    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add_circle</mat-icon>
      New Job
    </button>
  </header>

  @if (error()) {
    <div class="list-error" role="alert">{{ error() }}</div>
  }

  <app-data-table
    [loading]="loading()"
    [empty]="!loading() && jobs().length === 0"
    emptyIcon="work"
    emptyTitle="No jobs posted yet"
    emptyDescription="Create your first job opening to start collecting applications."
  >
    <table mat-table [dataSource]="jobs()" class="job-table">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Title</th>
        <td mat-cell *matCellDef="let job">{{ job.title }}</td>
      </ng-container>

      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef>Department</th>
        <td mat-cell *matCellDef="let job">{{ job.department?.name ?? '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="location">
        <th mat-header-cell *matHeaderCellDef>Location</th>
        <td mat-cell *matCellDef="let job">{{ job.location }}</td>
      </ng-container>

      <ng-container matColumnDef="employmentType">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let job">{{ job.employmentType.replace('_', ' ') }}</td>
      </ng-container>

      <ng-container matColumnDef="applicants">
        <th mat-header-cell *matHeaderCellDef>Applicants</th>
        <td mat-cell *matCellDef="let job">{{ job.applicationCount }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let job">
          <app-status-badge [label]="job.status.replace('_', ' ')" [variant]="statusVariant(job.status)" />
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let job">
          <button mat-icon-button (click)="openEditDialog(job, $event)" aria-label="Edit job">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="deleteJob(job, $event)" aria-label="Delete job">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="viewApplicants(row)"></tr>
    </table>
  </app-data-table>
</div>
