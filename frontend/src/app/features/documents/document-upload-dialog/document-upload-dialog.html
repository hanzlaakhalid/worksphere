<app-modal title="Upload Document">
  <form [formGroup]="form" (ngSubmit)="submit()" class="upload-form">
    @if (error()) {
      <div class="form-error" role="alert">{{ error() }}</div>
    }

    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" />
    </mat-form-field>

    <div class="field-row">
      <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>
        <mat-select formControlName="category">
          @for (category of categories; track category) {
            <mat-option [value]="category">{{ category.replace('_', ' ') }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      @if (data.canTargetEmployee) {
        <mat-form-field appearance="outline">
          <mat-label>Employee</mat-label>
          <mat-select formControlName="employeeId">
            <mat-option [value]="null">Company-wide</mat-option>
            @for (emp of data.employeeOptions; track emp.id) {
              <mat-option [value]="emp.id">{{ emp.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      }
    </div>

    <app-file-upload
      label="Upload file"
      accept="application/pdf,image/png,image/jpeg,image/webp"
      [currentUrl]="form.controls.fileUrl.value"
      (uploaded)="onFileUploaded($event)"
    />
  </form>

  <div modalActions>
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" type="button" [disabled]="saving()" (click)="submit()">
      @if (saving()) {
        <mat-spinner diameter="20" />
      } @else {
        Upload
      }
    </button>
  </div>
</app-modal>
