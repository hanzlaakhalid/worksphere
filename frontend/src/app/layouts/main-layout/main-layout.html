<mat-sidenav-container class="shell">
  <mat-sidenav
    #sidenav
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [fixedInViewport]="isHandset()"
  >
    <div class="brand">
      <mat-icon>hub</mat-icon>
      <span>WorkSphere</span>
    </div>

    <mat-nav-list>
      @for (item of navItems(); track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
          (click)="isHandset() && sidenav.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar" color="primary">
      @if (isHandset()) {
        <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle navigation">
          <mat-icon>menu</mat-icon>
        </button>
      }

      <span class="spacer"></span>

      <button mat-icon-button [matMenuTriggerFor]="userMenu" class="avatar-button" aria-label="Account menu">
        <span class="avatar">{{ userInitials() }}</span>
      </button>

      <mat-menu #userMenu="matMenu">
        <div class="user-summary">
          <strong>{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</strong>
          <span>{{ currentUser()?.email }}</span>
          <span class="role">{{ role() }}</span>
        </div>
        <mat-divider />
        <button mat-menu-item routerLink="/admin/dashboard" *appHasRole="'ADMIN'">
          <mat-icon>admin_panel_settings</mat-icon>
          <span>Admin Dashboard</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Log out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
