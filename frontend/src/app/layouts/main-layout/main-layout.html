<mat-sidenav-container class="shell">
  <mat-sidenav
    #sidenav
    class="sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    [fixedInViewport]="isHandset()"
  >
    <div class="brand">
      <span class="brand-mark">
        <mat-icon>hub</mat-icon>
      </span>
      <span class="brand-name">WorkSphere</span>
    </div>

    <mat-nav-list>
      @for (item of navItems(); track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
          (click)="isHandset() && sidenav.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle navigation">
          <mat-icon>menu</mat-icon>
        </button>
      }

      @if (!isHandset()) {
        <app-global-search />
      }

      <span class="spacer"></span>

      <div class="toolbar-actions">
        <app-notification-bell />

        <span class="toolbar-divider"></span>

        <button type="button" class="account-trigger" [matMenuTriggerFor]="userMenu" aria-label="Account menu">
          @if (!isHandset()) {
            <span class="account-text">
              <span class="account-name">{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</span>
              <span class="account-role">{{ roleLabel() }}</span>
            </span>
          }
          <span class="avatar">{{ userInitials() }}</span>
          <mat-icon class="chevron">expand_more</mat-icon>
        </button>
      </div>

      <mat-menu #userMenu="matMenu">
        <div class="user-summary">
          <span class="avatar avatar-lg">{{ userInitials() }}</span>
          <span class="user-summary-text">
            <strong>{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</strong>
            <span class="user-email">{{ currentUser()?.email }}</span>
            <span class="role-chip">{{ roleLabel() }}</span>
          </span>
        </div>
        <mat-divider />
        <button mat-menu-item routerLink="/admin/dashboard" *appHasRole="'ADMIN'">
          <mat-icon>admin_panel_settings</mat-icon>
          <span>Admin Dashboard</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Log out</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
