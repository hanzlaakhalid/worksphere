<button mat-icon-button [matMenuTriggerFor]="panel" (menuOpened)="onPanelOpened()" aria-label="Notifications">
  <mat-icon
    [matBadge]="unreadCount() > 0 ? unreadCount() : null"
    matBadgeColor="warn"
    matBadgeSize="small"
    [attr.aria-hidden]="unreadCount() > 0 ? 'false' : 'true'"
  >
    notifications
  </mat-icon>
</button>

<mat-menu #panel="matMenu" class="notification-panel">
  <div class="panel-header">
    <span>Notifications</span>
    @if (unreadCount() > 0) {
      <button mat-button (click)="markAllRead($event)">Mark all read</button>
    }
  </div>

  @if (loading()) {
    <div class="panel-message">Loading&hellip;</div>
  } @else if (notifications().length === 0) {
    <div class="panel-message">You're all caught up.</div>
  } @else {
    @for (notification of notifications(); track notification.id) {
      <button mat-menu-item class="notification-item" [class.unread]="!notification.isRead" (click)="selectNotification(notification)">
        <span class="dot" [class.visible]="!notification.isRead"></span>
        <span class="notification-text">
          <span class="title">{{ notification.title }}</span>
          <span class="message">{{ notification.message }}</span>
          <span class="time">{{ notification.createdAt | date: 'medium' }}</span>
        </span>
      </button>
    }
  }
</mat-menu>
